<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Store lifetimes along a navigation timeline. An app-wide store lives across every route. A grouped store lives while the user is inside the checkout routes, closes on leaving and starts fresh on return. A route-owned store lives only while its route is shown.">
  <style>
    .l-box { fill: var(--sl-color-gray-6); stroke: var(--sl-color-gray-5); stroke-width: 1.5; }
    .l-grid { stroke: var(--sl-color-gray-5); stroke-width: 1; stroke-dasharray: 3 5; }
    .l-route { font: 600 14px var(--__sl-font-mono, ui-monospace, monospace); fill: var(--sl-color-white); }
    .l-h { font: 700 16px var(--__sl-font, system-ui); fill: var(--sl-color-white); }
    .l-t { font: 600 13px var(--__sl-font-mono, ui-monospace, monospace); fill: var(--sl-color-accent-high); }
    .l-s { font: 500 13.5px var(--__sl-font, system-ui); fill: var(--sl-color-gray-2); }
    .l-g { font: 600 13px var(--__sl-font-mono, ui-monospace, monospace); fill: var(--sl-color-accent-high); }
    .l-app { fill: #16665c; }
    .l-group { fill: #8b5cf6; }
    .l-route-bar { fill: #e0812f; }
    .l-shell { fill: var(--sl-color-accent-low); stroke: var(--sl-color-accent); stroke-width: 1; stroke-dasharray: 4 4; }
    .l-dot { fill: #ffffff; }
    .l-x { stroke: #ffffff; stroke-width: 2.6; stroke-linecap: round; }
  </style>

  <!-- ShellRoute groups -->
  <rect x="264" y="8" width="220" height="344" rx="12" class="l-shell" />
  <text x="374" y="30" text-anchor="middle" class="l-g">ShellRoute /checkout</text>
  <rect x="600" y="8" width="112" height="344" rx="12" class="l-shell" />
  <text x="656" y="30" text-anchor="middle" class="l-g">/checkout</text>

  <!-- slot boundaries -->
  <path d="M262 84 V300 M486 84 V300 M598 84 V300" class="l-grid" />

  <!-- routes -->
  <g>
    <rect x="160" y="44" width="92" height="30" rx="15" class="l-box" /><text x="206" y="64" text-anchor="middle" class="l-route">/home</text>
    <rect x="272" y="44" width="92" height="30" rx="15" class="l-box" /><text x="318" y="64" text-anchor="middle" class="l-route">cart</text>
    <rect x="384" y="44" width="92" height="30" rx="15" class="l-box" /><text x="430" y="64" text-anchor="middle" class="l-route">pay</text>
    <rect x="496" y="44" width="92" height="30" rx="15" class="l-box" /><text x="542" y="64" text-anchor="middle" class="l-route">/home</text>
    <rect x="608" y="44" width="92" height="30" rx="15" class="l-box" /><text x="654" y="64" text-anchor="middle" class="l-route">cart</text>
  </g>

  <!-- lane labels -->
  <text x="10" y="124" class="l-h">App-wide</text>
  <text x="10" y="144" class="l-t">AppState</text>
  <text x="10" y="204" class="l-h">Route group</text>
  <text x="10" y="224" class="l-t">.grouped</text>
  <text x="10" y="284" class="l-h">One route</text>
  <text x="10" y="304" class="l-t">createStore()</text>

  <!-- app-wide: one bar for the whole session -->
  <rect x="152" y="112" width="560" height="18" rx="9" class="l-app" />
  <circle cx="161" cy="121" r="5.5" class="l-dot" />
  <path d="M698 114 L708 121 L698 128" class="l-x" fill="none" />
  <text x="160" y="156" class="l-s">created on first read, kept until the root scope is disposed</text>

  <!-- grouped -->
  <rect x="268" y="192" width="214" height="18" rx="9" class="l-group" />
  <circle cx="277" cy="201" r="5.5" class="l-dot" />
  <path d="M466 195 L476 207 M476 195 L466 207" class="l-x" />
  <rect x="604" y="192" width="108" height="18" rx="9" class="l-group" />
  <circle cx="613" cy="201" r="5.5" class="l-dot" />
  <text x="272" y="236" class="l-s">shared by cart and pay</text>
  <text x="608" y="236" class="l-s">starts fresh</text>

  <!-- route-owned -->
  <g>
    <rect x="154" y="272" width="104" height="18" rx="9" class="l-route-bar" /><circle cx="163" cy="281" r="5.5" class="l-dot" /><path d="M242 275 L252 287 M252 275 L242 287" class="l-x" />
    <rect x="266" y="272" width="104" height="18" rx="9" class="l-route-bar" /><circle cx="275" cy="281" r="5.5" class="l-dot" /><path d="M354 275 L364 287 M364 275 L354 287" class="l-x" />
    <rect x="378" y="272" width="104" height="18" rx="9" class="l-route-bar" /><circle cx="387" cy="281" r="5.5" class="l-dot" /><path d="M466 275 L476 287 M476 275 L466 287" class="l-x" />
    <rect x="490" y="272" width="104" height="18" rx="9" class="l-route-bar" /><circle cx="499" cy="281" r="5.5" class="l-dot" /><path d="M578 275 L588 287 M588 275 L578 287" class="l-x" />
    <rect x="602" y="272" width="110" height="18" rx="9" class="l-route-bar" /><circle cx="611" cy="281" r="5.5" class="l-dot" />
  </g>
  <text x="160" y="316" class="l-s">each visit gets a new store</text>

  <!-- legend -->
  <circle cx="16" cy="337" r="5.5" class="l-app" /><circle cx="16" cy="337" r="2.5" class="l-dot" />
  <text x="28" y="342" class="l-s">created</text>
  <path d="M92 332 L101 342 M101 332 L92 342" stroke="var(--sl-color-gray-2)" stroke-width="2.4" stroke-linecap="round" />
  <text x="108" y="342" class="l-s">closed</text>
</svg>
