name: switchable_state_getx
description: >-
  GetX adapter for switchable_state. Each store is an Rx value rendered with
  Obx, with selective rebuilds and no GetMaterialApp needed.
version: 0.2.0
homepage: https://switchable-state.vercel.app/
repository: https://github.com/EugenioTesio/switchable_state/tree/main/packages/switchable_state_getx
issue_tracker: https://github.com/EugenioTesio/switchable_state/issues
documentation: https://switchable-state.vercel.app/adapters/getx/
topics:
  - state-management
  - getx

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  switchable_state: ^0.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  switchable_state_test: ^0.2.0
