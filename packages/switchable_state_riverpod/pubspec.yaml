name: switchable_state_riverpod
description: >-
  Riverpod adapter for switchable_state. Each store is a Notifier in its own
  ProviderContainer, rendered with Consumer and provider.select.
version: 0.1.0
homepage: https://eugeniotesio.github.io/switchable_state/
repository: https://github.com/EugenioTesio/switchable_state/tree/main/packages/switchable_state_riverpod
issue_tracker: https://github.com/EugenioTesio/switchable_state/issues
documentation: https://eugeniotesio.github.io/switchable_state/adapters/riverpod/
topics:
  - state-management
  - riverpod

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  switchable_state: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  switchable_state_test: ^0.1.0
