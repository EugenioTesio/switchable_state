name: switchable_state_provider
description: >-
  provider adapter for switchable_state. Each store is a ChangeNotifier,
  rendered with Consumer and Selector.
version: 0.1.0
homepage: https://switchable-state.vercel.app/
repository: https://github.com/EugenioTesio/switchable_state/tree/main/packages/switchable_state_provider
issue_tracker: https://github.com/EugenioTesio/switchable_state/issues
documentation: https://switchable-state.vercel.app/adapters/provider/
topics:
  - state-management
  - provider

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  switchable_state: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  switchable_state_test: ^0.1.0
